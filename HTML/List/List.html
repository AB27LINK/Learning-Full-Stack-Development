<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>

<body>
    <div>
        <h1>Food List</h1>
        <div>
            <h2> Unordered List</h2>
            <ul type="circle">
                <li>Chai</li>
                <li>Coffee</li>
                <li>Samosa</li>
                <li>Sandwich</li>
                <li>Ice-cream</li>
            </ul>
        </div>
        <div>
            <h2>Ordered List</h2>
            <ol type="I">
                <li>Chai</li>
                <li>Coffee</li>
                <li>Samosa</li>
                <li>Sandwich</li>
                <li>Ice-cream</li>
            </ol>
        </div>
        <div>
            <h2>Description List</h2>
            <dt>
                Terms and Conditions
            </dt>
            <dd>
                Some written terms and conditions for this site
            </dd>
        </div>
    </div>
</body>

</html>
